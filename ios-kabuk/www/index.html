<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TÜRKAİ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02070d; color: #d6f4ff; font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); gap: 14px; text-align: center; }
  h1 { margin: 0; letter-spacing: .5em; font-size: 22px; color: #5be1ff; font-weight: 600; padding-left: .5em; }
  p { margin: 0; color: #8fb3c4; max-width: 420px; }
  form { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
  input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #1c4458; background: #07131d; color: #fff; font-size: 16px; }
  button { padding: 14px; border-radius: 12px; border: 1px solid #5be1ff; background: #0b3040; color: #fff; font-size: 17px; font-weight: 600; }
  button.ghost { background: transparent; border-color: #1c4458; color: #8fb3c4; font-weight: 400; }
  #status { min-height: 1.4em; color: #ffcc7a; }
  .err { color: #ff8a80 !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>TÜRKAİ</h1>

<form id="form" hidden novalidate>
  <p>TÜRKAİ sunucunun adresini bir kez gir. Sonraki açılışlarda doğrudan bağlanır.</p>
  <input id="url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://turkai.onrender.com">
  <input id="tok" type="password" autocapitalize="off" autocorrect="off" placeholder="Erişim anahtarı (ACCESS_TOKEN)">
  <button type="submit">Bağlan</button>
</form>

<div id="busy" hidden style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:420px">
  <p id="host"></p>
  <button class="ghost" id="change" type="button">Adresi değiştir</button>
</div>
<p id="status"></p>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var get = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var set = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var cancelled = false, running = false;

  function clean(u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u.replace(/\/+$/, '');
  }
  function show(form) { $('form').hidden = !form; $('busy').hidden = form; $('busy').style.display = form ? 'none' : 'flex'; }
  function msg(t, bad) { var s = $('status'); s.textContent = t; s.className = bad ? 'err' : ''; }

  // Sunucuya ulaşılabiliyor mu? (CORS yüzünden yanıt okunamaz; ağ hatası olmaması yeter.) Ücretsiz bulutta ilk istek ~1 dk sürebilir.
  async function reachable(base) {
    var c = new AbortController(); var t = setTimeout(function () { c.abort(); }, 12000);
    try { await fetch(base + '/api/time', { mode: 'no-cors', cache: 'no-store', signal: c.signal }); return true; }
    catch (e) { return false; } finally { clearTimeout(t); }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function connect() {
    if (running) return; running = true; cancelled = false;
    var base = clean(get('turkai.server')); var tok = get('turkai.token');
    if (!base) { running = false; show(true); return; }
    show(false); $('host').textContent = base.replace(/^https?:\/\//, '');
    msg('Bağlanıyor…');
    await sleep(1500);
    var start = Date.now(), tries = 0;
    while (!cancelled) {
      if (await reachable(base)) {
        var go = base + '/' + (tok ? '?token=' + encodeURIComponent(tok) : '');
        location.replace(go); return;
      }
      tries++;
      if (Date.now() - start > 120000) { msg('Sunucuya ulaşılamadı. Adresi kontrol et ya da biraz sonra tekrar dene.', true); running = false; return; }
      msg('Sunucu uyanıyor… (' + tries + ') Ücretsiz bulutta ilk açılış 1 dakika sürebilir.');
      await sleep(2500);
    }
    running = false;
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = clean($('url').value);
    if (!u) { msg('Adres gerekli', true); return; }
    set('turkai.server', u); set('turkai.token', $('tok').value.trim());
    msg(''); connect();
  });
  $('change').addEventListener('click', function () {
    cancelled = true; running = false;
    $('url').value = get('turkai.server'); $('tok').value = get('turkai.token'); msg(''); show(true);
  });
  $('url').value = get('turkai.server'); $('tok').value = get('turkai.token');
  connect();
})();
</script>
</body>
</html>
